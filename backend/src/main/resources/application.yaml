server:
  port: 8080

spring:
  application:
    name: music-catalog

  data:
    mongodb:
      uri: mongodb://user:password@localhost:27017/musicdb?authSource=admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/music
          jwk-set-uri: http://localhost:8081/realms/music/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            provider: keycloak-provider
            client-id: music-service
            client-secret: XbHlTBe2uE5p4kZxvWHv5tgtz3OWGzGa
            scope:
              - openid
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak-provider:
            issuer-uri: http://localhost:8081/realms/music

springdoc:
  swagger-ui:
    enabled: true
    path: /docs